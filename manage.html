<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Tests</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bd3'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Apply the theme before first paint to avoid a flash.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('mcq.theme')); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>Manage tests</span>
      </div>
      <div class="row">
        <a class="btn btn-ghost" href="index.html">← Practice</a>
        <button id="theme-toggle" class="btn btn-ghost" type="button"></button>
      </div>
    </div>
  </header>

  <main id="app" class="container">
    <div class="loading">Loading tests…</div>
  </main>

  <script src="shared.js"></script>
  <script src="manage.js"></script>
</body>
</html>
